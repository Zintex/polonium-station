- type: entity
  id: RandomSoap
  name: random soap spawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Objects/Specific/Janitorial/soap.rsi
        state: soap-4
  - type: RandomSpawner
    prototypes:
      - Soap
      - SoapHomemade
      - SoapNT
      - SoapDeluxe
    chance: 0.95
    rarePrototypes:
      - SoapSyndie
      - SoapOmega
    rareChance: 0.05

- type: entityTable # max size 1x2 (for now)
  id: SlipTable
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: AllBananaPeelsTable
    - !type:NestedSelector
      tableId: AllSoapsTable
    - !type:GroupSelector # Other
      weight: 0.02 # 1 in 100
      children:
      - id: FoodButter
      - id: FoodCannabisButter
        weight: 0.5
      - id: BananaPhoneInstrument
        weight: 0.2
